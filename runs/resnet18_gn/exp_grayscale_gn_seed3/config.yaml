experiment: exp_grayscale_gn
colorspace: grayscale
model:
  name: resnet18
  pretrained: false
  num_classes: 10
  norm: gn
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0
  scheduler: step
  scheduler_params:
    step_size: 25
    gamma: 0.1
data:
  dataset: cifar10
  num_workers: 4
device: cuda
seed: 42
output_dir: results_v7/exp_grayscale_gn
